// ============ 大类映射 ============
function groupOf(r){
  const m=r.m, n=r.n;
  if(["炒"].includes(m)) return "炒菜";
  if(["焖"].includes(m)) return "炖焖";
  if(["蒸"].includes(m)) return "蒸菜";
  if(["煮"].includes(m)){
    if(/汤|羹|粥|糖水|糊|沙|水$/.test(n)) return "汤羹";
    if(/面|粉|饺|饭|粥/.test(n)) return "面点主食";
    return "汤羹";
  }
  if(["煎","炸","烤"].includes(m)) return "煎炸烤";
  if(["拌"].includes(m)) return "凉拌";
  if(/糕|包|饼|饺子|面|粉|饭|馒头/.test(n)) return "面点主食";
  if(/糖水|糊|沙|炖奶|双皮奶|姜撞奶|炖蛋/.test(n)) return "甜品糖水";
  return "炒菜";
}

// ============ 交互 ============
let sel=[],people=1,curCat="全部",curMethod="全部",curGroup="全部";
const $=id=>document.getElementById(id);

function initChips(){
  const catBox=$("cats");
  const cats=["全部",...Object.keys(CATS)];
  catBox.innerHTML=cats.map(c=>`<div class="chip cat ${c==="全部"?"active":""}" data-c="${c}">${c}</div>`).join("");
  catBox.querySelectorAll(".cat").forEach(el=>{
    el.onclick=()=>{
      catBox.querySelectorAll(".cat").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
      curCat=el.dataset.c;
      renderChips();
    };
  });
  renderChips();
}
function renderChips(){
  const box=$("chips");
  let keys=curCat==="全部"?Object.keys(DB):CATS[curCat].filter(k=>DB[k]);
  box.innerHTML=keys.map(k=>`<div class="chip${sel.includes(k)?" active":""}" data-k="${k}">${k}</div>`).join("");
  box.querySelectorAll(".chip").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k;
      const i=sel.indexOf(k);
      if(i>=0){sel.splice(i,1);el.classList.remove("active");}
      else{if(sel.length>=6){alert("最多选6种食材/调料");return;}sel.push(k);el.classList.add("active");}
      $("cnt").textContent="已选"+sel.length+"种";
    };
  });
}
initChips();

document.querySelectorAll("#people .chip").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll("#people .chip").forEach(e=>e.classList.remove("active"));
    el.classList.add("active");
    people=+el.dataset.p;
  };
});
document.querySelectorAll("#methods .chip").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll("#methods .chip").forEach(e=>e.classList.remove("active"));
    el.classList.add("active");
    curMethod=el.dataset.m;
  };
});
document.querySelectorAll("#groups .chip").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll("#groups .chip").forEach(e=>e.classList.remove("active"));
    el.classList.add("active");
    curGroup=el.dataset.g;
  };
});

function go(){
  const custom=$("custom").value.trim();
  if(custom){
    custom.split(/[\s,，、]+/).forEach(x=>{
      if(x&&DB[x]&&!sel.includes(x)&&sel.length<6)sel.push(x);
    });
    $("cnt").textContent="已选"+sel.length+"种";
    renderChips();
  }
  if(sel.length<1){alert("至少选1种食材或调料");return;}

  // 主料命中 ≥1 即可
  let matched=R.filter(r=>r.need.filter(x=>sel.includes(x)).length>=1);
  if(curMethod!=="全部") matched=matched.filter(r=>r.m===curMethod);
  if(curGroup!=="全部") matched=matched.filter(r=>groupOf(r)===curGroup);

  matched=matched.sort((a,b)=>{
    // 主料命中数优先
    const ca=a.need.filter(x=>sel.includes(x)).length;
    const cb=b.need.filter(x=>sel.includes(x)).length;
    if(cb!==ca) return cb-ca;
    // 再看调料命中数
    const oa=(a.opt||[]).filter(x=>sel.includes(x)).length;
    const ob=(b.opt||[]).filter(x=>sel.includes(x)).length;
    if(ob!==oa) return ob-oa;
    // 主料少的优先
    return a.need.length-b.need.length;
  }).slice(0,12);

  if(matched.length===0){
    $("out").innerHTML='<div class="card"><div class="empty">没有匹配到菜谱，换个组合试试</div></div>';
    return;
  }

  let html="";
  matched.forEach(r=>{
    let rows="",total=0,miss=[];
    r.need.concat(r.opt||[]).forEach(name=>{
      const info=DB[name];if(!info)return;
      let amt=1;
      if(info.k==="肉")amt=150*people;
      else if(info.k==="海")amt=100*people;
      else if(info.k==="主")amt=1*people;
      else if(info.k==="调")amt=1;
      else if(info.k==="蛋")amt=2*people;
      else amt=1*people;
      if(info.k==="肉"||info.k==="海")amt=Math.round(amt/50)*50;
      const g=amt*info.w,kcal=g*info.c/100;total+=kcal;
      const have=sel.includes(name);
      rows+=`<div class="row"><span>${have?"✅":"⬜"} ${name} <span style="color:#aaa">${amt}${info.u}</span></span><span class="kcal">${kcal.toFixed(0)} kcal</span></div>`;
      if(!have&&(r.need||[]).includes(name))miss.push(name);
    });
    const hit=r.need.filter(x=>sel.includes(x)).length;
    html+=`<div class="card"><div class="rt">${r.n}</div><div style="margin-bottom:8px"><span class="tag">${r.m}</span><span class="tag">${groupOf(r)}</span><span class="tag">${people}人份</span><span class="tag">命中 ${hit}/${r.need.length}</span></div>${rows}<div class="total">总 ${total.toFixed(0)} kcal · 每人 ${(total/people).toFixed(0)} kcal</div>${miss.length?`<div class="miss">还缺主料：${miss.join("、")}</div>`:""}</div>`;
  });
  $("out").innerHTML=html;
}
</script>
